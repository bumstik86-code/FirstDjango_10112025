{% extends "base.html" %}
{% block title %} Item page {% endblock  %}

{% block content %}
    {{ block.super }}
    <h2>{{item.id}}</h2>
    <div>
        <p>Наименование: {{item.name}}</p>
    </div>
    <div>
        <p>Производитель: {{item.brand}} </p>
    </div>
    <div>
        <p>Количество: {{item.count | default:"товара нет на складе"}}</p>
    </div>
      <div>
        <p>Описание {{item.description}}</p>
    </div>
    <br>

{% endblock  %}
