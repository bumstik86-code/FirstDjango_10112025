<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{name}}]</title>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/items">Items</a></li>
            <li><a href="/about">About</a></li>
        </ul>
    </nav>

    {% if bad_id %}
        <h2>Товар с id = {{bad_id}} отсутствует.</h2>
    {% else %}
        <h2>{{id}}</h2>
        Наименование: {{name}} <br>
        Количество: {% if quantity != 0 %}{{quantity}}{% else %}Товар отсутствует{% endif %} 
    {% endif %}
<br>
<br>
<a href="/items">Назад к списку товаров</a>
</body>
</html>
