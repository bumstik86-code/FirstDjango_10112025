{% extends "base.html" %}
{% block title %} Item page {% endblock  %}

{% block content %}
    {{ block.super }}
    <h2>Список товаров:</h2>

    <div class="items">
        {% for item in goods  %}
        <div class="item">
            <a href='{% url "item-detail" item.id %}'>
                <p class="item_name">{{item.name}}</p>
                <p>Описание товара:</p>
                <p>{{item.description}}</p>
            </a>
        </div>
        {% endfor %}
    </div>
{% endblock  %}
